name: Publish to npm

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publisher (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        # npm bundled with Node 22 is 10.x, which cannot exchange the GitHub
        # OIDC token for an npm publish credential (provenance still signs, but
        # the PUT is unauthenticated and 404s). Trusted publishing needs >=11.5.1.
        run: npm install -g npm@latest

      - name: Install dependencies
        # --include=dev forces devDependencies to install even if the runner
        # sets NODE_ENV=production (which would otherwise omit them and break
        # the type check, since @earendil-works/pi-coding-agent is dev-only).
        run: npm ci --include=dev

      - name: Debug dependency tree
        run: |
          echo "node: $(node -v) npm: $(npm -v)"
          ls node_modules/@earendil-works/ 2>&1 || echo "MISSING @earendil-works"
          node -e "console.log('pi version:', require('@earendil-works/pi-coding-agent/package.json').version)" 2>&1 || echo "pi not resolvable"
          echo "omit=$(npm config get omit)"
          echo "NODE_ENV=${NODE_ENV:-unset}"

      - name: Type check
        run: npm run check

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
